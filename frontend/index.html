<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Demo console for a Kubernetes operations copilot: Text2SQL, advanced RAG, caching and LLM security." />
    <title>K8s Ops Copilot</title>
    <script>
      // Apply the saved or system theme before first paint (no light flash in dark mode).
      try {
        var t = localStorage.getItem("advrag.theme") || "dark"
        if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
